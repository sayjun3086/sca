  <!-- [수정] GAS LibBase_spa.FN_file_include 대신 정적 CSS 파일 로드 -->

  <!-- [추가] 기존 github_index.txt의 PWA 바로가기 설치 모달 전용 스타일 유지 -->
  <style>
    /* 팝업 모달 공통 배경 */
    .modal-overlay { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.5); z-index: 99999; display: none; 
      justify-content: center; align-items: center; padding: 20px; 
      box-sizing: border-box; backdrop-filter: blur(3px); font-family: sans-serif; 
    }

    /* 모달 본체 박스 */
    .modal-content { 
      background: white; padding: 30px; border-radius: 20px; max-width: 420px; width: 100%;       
      box-sizing: border-box; text-align: center; line-height: 1.6; font-size: 15px; color: #333; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.2); animation: modalFadeIn 0.3s ease-out; 
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-content b { color: #4A90E2; }
    .modal-btn { display: block; width: 100%; margin-top: 12px; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; transition: background 0.2s; }
    .action-btn { background: #4A90E2; color: white; }
    .action-btn:hover { background: #357ABD; }
    .close-btn { background: #e9ecef; color: #495057; margin-top: 8px; }
    .close-btn:hover { background: #dee2e6; }
  </style>

  <!-- [추가] 학교별 환경설정 스크립트(SCA_BASE.js) 로드 -->
  <script src="SCA_BASE.js"></script>
</head>
<body>

  <!-- [추가] 기존 github_index.txt의 PWA 앱/바로가기 설치 안내 모달 2종 통합 -->

      <button class="modal-btn close-btn" onclick="document.getElementById('install-banner').style.display='none'">다음에 하기</button>

  <header class="top-biz-header">

  <nav id="dynamicMenuBar" class="win-toolbar"></nav>

  <div id="customErrorModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10001;">
      <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 8px; text-align: center; min-width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
          <p id="errorMessage" style="margin: 20px 0; font-size: 16px; line-height: 1.5;"></p>
          <div id="modalButtons">
              <button id="modalConfirmBtn" style="width: 120px; background: #34495e; color: white; border: none; padding: 10px 25px; border-radius: 4px; cursor: pointer; transition: 0.2s;">확인</button>
              <button id="modalCancelBtn" style="width: 120px; background: #bdc3c7; color: black; border: none; padding: 10px 25px; border-radius: 4px; cursor: pointer; display: none; transition: 0.2s;">취소</button>
          </div>
      </div>
  </div>

  <div class="info-wrapper">
    <div id="info-bar_1" class="info-bar">
      <span class="user-name">👤 환영합니다.</span>
      <div class="btn-group-tree">
        <button class="btn-tree w-a9" onclick="navigateTo(APP_STATE.portalCode)">포털홈가기</button>
        <button class="btn-tree w-b1" onclick="requestInstallModal()">바로가기앱설치</button>
      </div>
    </div>
    
    <div id="info-bar_2" class="info-bar" style="display: none;">
      <span class="user-name" id="loggedInUserName">👤 방문자님 반갑습니다.</span>
      <div class="btn-group-tree">
        <a class="btn-tree w-a7" onclick="navigateTo(APP_STATE.mainmenuCode);" style="cursor: pointer;">메인메뉴</a>

      </div>

    <div id="gongContainer" style="display: none;">
      <table class="gong-table" id="gongTable">

        <h2 class="page-title" id="pageTitleText">OO 클라우드 포털</h2>

  <div class="copyright-wrapper">
    <!-- [수정] GAS 템플릿(CFG.copyRight) 대신 JS로 즉시 바인딩하기 위해 id="footerCopyright" 부여 -->
    <span id="footerCopyright"></span>
  </div>  


  <!-- LibBase_spa 내부에 포함된 25_Common_Script.html -->
  <script>

    // =========================================================================
    // 보안 및 유틸리티 헬퍼 함수
    // =========================================================================
    // XSS 공격 방어용 이스케이프 함수
    function escapeHtml(unsafe) {
      if (!unsafe) return "";
      return String(unsafe)
           .replace(/&/g, "&amp;")
           .replace(/</g, "&lt;")
           .replace(/>/g, "&gt;")
           .replace(/"/g, "&quot;")
           .replace(/'/g, "&#039;");
    }

    // ⭐️ [신규] URL을 안전하고 짧은 16진수(Hex) 해시값으로 변환하는 함수
    function getUrlToHexHash(url) {
      let hash = 0;
      for (let i = 0; i < url.length; i++) {
        hash = ((hash << 5) - hash) + url.charCodeAt(i);
        hash |= 0; // 32비트 정수로 강제 변환
      }
      // 부호 없는 32비트 정수를 16진수로 변환하고 윈도우 이름용 접두어 부착
      return "win_" + (hash >>> 0).toString(16); 
    }

    // =========================================================================
    // 메뉴바 만들기 공동함수
    // =========================================================================

    // ⭐️ 전역 최상단에 handleMenuClick 함수 선언
    window.handleMenuClick = function(event, url, menuCode, targetOs, isExternal) {
      if (event) event.stopPropagation();

      // ⭐️ [추가] 메뉴바 또는 북마크 클릭 시 6시간 경과 여부를 최우선 확인하여 만료 시 즉시 자동 로그아웃
      if (typeof APP_STATE !== 'undefined' && APP_STATE.isLoggedIn && typeof window.checkAndTouchClientSession === 'function') {
        if (!window.checkAndTouchClientSession()) return;
      }

      const ua = navigator.userAgent || navigator.vendor || window.opera;

      
      // ⭐️ [요청사항 반영] 오직 'Windows' 운영체제 여부로만 PC/모바일을 엄격하게 이분화
      const isWindows = /Windows/i.test(ua);

      // PC 전용 메뉴 방어 (Windows가 아니면 무조건 차단)
      if (targetOs === 'PC' && !isWindows) {
        if (typeof showModal === 'function') {
          showModal("⛔ PC(Windows) 환경에서만 실행 가능한 메뉴입니다.<br><span style='font-size:12px; color:#888;'>현재 기기에서는 이용할 수 없습니다.</span>", { showCancel: false });
        } else {
          alert("⛔ PC(Windows) 환경에서만 실행 가능한 메뉴입니다.");
        }
        return;
      }
      
      // 모바일 전용 메뉴 방어 (Windows이면 무조건 차단)
      if (targetOs === 'MOBILE' && isWindows) {
        if (typeof showModal === 'function') {
          showModal("⛔ 모바일 환경에서만 실행 가능한 메뉴입니다.<br><span style='font-size:12px; color:#888;'>PC(Windows) 환경에서는 이용할 수 없습니다.</span>", { showCancel: false });
        } else {
          alert("⛔ 모바일 환경에서만 실행 가능한 메뉴입니다.");
        }
        return;
      }

      if (isExternal) {
        // ⭐️ 외부 링크 처리: 해시 함수를 통해 안전한 새 창 이름(Target) 생성
        const hexTargetName = typeof getUrlToHexHash === 'function' ? getUrlToHexHash(url) : url.replace(/[^a-zA-Z0-9]/g, '_');
        window.open(url, hexTargetName);
      } else {
        // ⭐️ SPA 내부 이동 처리
        if (typeof navigateTo === 'function' && menuCode) {
          navigateTo(menuCode); 
        } else {
          if (typeof showOverlay === 'function') showOverlay(true);
          window.open(url, '_top');
        }
      }
    };  


    // =========================================================================
    // 클라이언트 사이드 캐싱 및 렌더링 로직 (공통 모듈)
    // =========================================================================

    // 외부에서 호출 가능한 초기화 함수
    window.initMenuBarData = function(userHashId, currentSid, onComplete, forceRefresh) {
      if (!userHashId) {
        console.error("initMenuBarData: userHashId 값이 없습니다.");
        if (onComplete) onComplete();
        return;
      }

      // ⭐️ [SPA 해시 라우터 연동] 기존의 개별 로컬스토리지 및 구버전 syncMenuData 호출을 제거하고,
      // SPA_CACHE.syncData("MENUBAR")를 사용하여 로컬 캐시 0초 선렌더링 후 서버 해시를 비교합니다.
      if (typeof SPA_CACHE !== 'undefined') {
        // ⭐️ 마지막 인자로 forceRefresh를 전달하여 필요시 로컬 캐시를 무시하고 서버에서 즉시 다시 받아오도록 설정
        SPA_CACHE.syncData("MENUBAR", function(menuList, isFromCache) {
          renderClientMenuBar(menuList, currentSid);
          if (onComplete) {
            onComplete();
            onComplete = null;
          }
        }, forceRefresh); 
      }
    };


    // 클라이언트 메뉴 렌더링 함수 (내부 전용)
    function renderClientMenuBar(menuList, currentSid) {
      const container = document.getElementById('dynamicMenuBar');
      if (!container) return; 

      if (!menuList || menuList.length === 0) {
        container.innerHTML = '<div class="win-menu-item">접근 가능한 메뉴가 없습니다.</div>';
        return;
      }

      // 메뉴 트리를 만들기 위해 구조화
      const tree = {};
      menuList.forEach(m => {
        const parts = String(m.menuLevel || "").split('-');
        if (parts.length < 4) return;
        
        const d1 = parts[1]; 
        const d2 = parts[2]; 
        const d3 = parts[3]; 

        if (!tree[d1]) tree[d1] = { info: null, children: {} };

        if (d2 === '000' && d3 === '000') {
          tree[d1].info = m; 
        } else if (d3 === '000') {
          if (!tree[d1].children[d2]) tree[d1].children[d2] = { info: null, children: {} };
          tree[d1].children[d2].info = m; 
        } else {
          if (!tree[d1].children[d2]) tree[d1].children[d2] = { info: null, children: {} };
          tree[d1].children[d2].children[d3] = m; 
        }
      });

      // 권한, URL, 기기 정보를 판단하여 클릭 이벤트를 생성
      function getClickAttr(menu) {
        if (!menu.isAllowed) {
          return `onclick="if(typeof showModal === 'function') { showModal('⛔ 해당 메뉴에 대한 접근 권한이 없습니다.<br>', { showCancel: false }); } else { alert('⛔ 해당 메뉴에 대한 접근 권한이 없습니다.'); } event.stopPropagation();" style="color:#aaa; cursor:not-allowed;"`;
        }

        let linkType = parseInt(menu.linkType) || 0; 
        let isExternal = (linkType === 1 || linkType === 2); 
        
        let finalUrl = "";
        if (isExternal) {
          finalUrl = menu.linkUrl || "";
        } else {
          const baseUrl = menu.linkUrl || "";
          const separator = baseUrl.indexOf('?') !== -1 ? '&' : '?';
          finalUrl = baseUrl ? baseUrl + separator + "id=" + currentSid + "&code=" + menu.menuCd : "";
        }

        let targetOs = 'ALL';
        if (linkType === 2 || linkType === 6) targetOs = 'PC';
        if (linkType === 7) targetOs = 'MOBILE';

        // ⭐️ 보안: XSS 방어를 위해 파라미터 이스케이프 및 작은따옴표 방어 적용
        const safeUrl = String(escapeHtml(finalUrl)).replace(/'/g, "\\'");
        const safeMenuCd = String(escapeHtml(menu.menuCd)).replace(/'/g, "\\'");

        return `onclick="window.handleMenuClick(event, '${safeUrl}', '${safeMenuCd}', '${targetOs}', ${isExternal});"`;
      }

      // 메뉴정보를 판단하여 메뉴표시를 생성
      // ⭐️ [수정] depth(단계)를 전달받아 2단계 이상에서 권한이 없으면 잠금 표시(🔒) 부착 및 PC 표기를 WIN으로 통일
      function getDisplayName(menu, depth) {
        let name = escapeHtml(menu.shortName || menu.menuName); 
        let linkType = parseInt(menu.linkType) || 0;
        if (linkType === 2 || linkType === 6) name += " <span style='font-size:10px; color:#888;'>(WIN)</span>";
        if (linkType === 7) name += " <span style='font-size:10px; color:#888;'>(M)</span>";
        
        if (depth >= 2 && !menu.isAllowed) {
          name = "🔒 " + name;
        }
        return name;
      }

      let html = '';
      const keys1 = Object.keys(tree).sort();
      
      for (const k1 of keys1) {
        const node1 = tree[k1];
        if (!node1.info) continue;

        const m1 = node1.info;
        // ⭐️ 1레벨(대메뉴)은 권한이 없으면 아예 비노출
        if (!m1.isAllowed) continue;

        const keys2 = Object.keys(node1.children).sort();
        const hasChildren1 = keys2.length > 0;
        
        html += `<div class="win-menu-item" ${!hasChildren1 ? getClickAttr(m1) : ''}>${getDisplayName(m1, 1)}`;

        if (hasChildren1) {
          html += `\n  <div class="win-dropdown">\n`;
          for (const k2 of keys2) {
            const node2 = node1.children[k2];
            if (!node2.info) continue;
            
            const m2 = node2.info;
            const keys3 = Object.keys(node2.children).sort();
            const hasChildren2 = keys3.length > 0;
            
            // ⭐️ 2단계 메뉴: 권한이 없거나(!m2.isAllowed) 3단계 하위 메뉴가 없으면 클릭 시 권한 경고/실행 속성을 부여하고,
            // 권한이 없을 때는 하위 3단계 메뉴 트리도 열리지 않도록 차단하여 비활성화 처리합니다.
            const canOpenSub = hasChildren2 && m2.isAllowed;
            html += `    <div class="win-dropdown-item" ${!canOpenSub ? getClickAttr(m2) : ''}><span>${getDisplayName(m2, 2)}</span>`;

            if (canOpenSub) {
              html += ` <span class="win-arrow">▶</span>\n      <div class="win-sub-dropdown">\n`;
              for (const k3 of keys3) {
                const m3 = node2.children[k3];
                // ⭐️ 3단계 메뉴: 권한 없으면 잠금 표시(🔒)와 함께 비활성화 속성(getClickAttr) 자동 적용
                html += `        <div class="win-dropdown-item" ${getClickAttr(m3)}><span>${getDisplayName(m3, 3)}</span></div>\n`;
              }
              html += `      </div>\n`;
            }
            html += `    </div>\n`;
          }
          html += `  </div>\n`;
        }
        html += `</div>\n`;
      }

      // 1레벨 권한 필터링 결과 표시할 대메뉴가 하나도 없는 경우의 예외 처리
      if (!html) {
        container.innerHTML = '<div class="win-menu-item" style="color:#888; cursor:default;">표시할 메뉴가 없습니다.</div>';
        return;
      }

      container.innerHTML = html;
      
      // ⭐️ DOM 업데이트 완료 후 한 번만 호버 이벤트 바인딩 실행
      bindMenuHoverEvents();
    }


    // ⭐ 동적 렌더링 후 호출될 호버 이벤트 바인딩 함수
    function bindMenuHoverEvents() {
      const menuItems = document.querySelectorAll('.win-menu-item');
      
      menuItems.forEach(item => {
        // 기존 이벤트 리스너 중복 방지를 위해 클론 또는 안전장치를 쓰면 좋으나,
        // innerHTML로 재생성되었으므로 새로 붙여도 안전함.
        item.addEventListener('mouseenter', function() {
          const dropdown = this.querySelector('.win-dropdown');
          if (!dropdown) return;

          dropdown.classList.remove('align-right');
          
          const rect = item.getBoundingClientRect();
          const dropdownWidth = 120; 
          const windowWidth = window.innerWidth;
          
          if (rect.left + dropdownWidth > windowWidth) {
            dropdown.classList.add('align-right');
          }
        });

        // ⭐️ [성능 수정] 마우스 진입 시마다 하위 메뉴 리스너가 중복 등록되지 않도록 최초 1회만 분리하여 바인딩
        const dropdown = item.querySelector('.win-dropdown');
        if (dropdown) {
          const subItems = dropdown.querySelectorAll('.win-dropdown-item');
          subItems.forEach(subItem => {
            subItem.addEventListener('mouseenter', function(e) {
              const subDropdown = this.querySelector('.win-sub-dropdown');
              if (!subDropdown) return;

              subDropdown.classList.remove('align-left');
              this.classList.remove('arrow-flip');
              
              const subRect = this.getBoundingClientRect();
              const subDropdownWidth = 100; 
              const windowWidth = window.innerWidth;
              const isParentAlignRight = dropdown.classList.contains('align-right');
              
              if (isParentAlignRight || (subRect.right + subDropdownWidth > windowWidth)) {
                subDropdown.classList.add('align-left');
                this.classList.add('arrow-flip');
              }
            });
          });
        }
      });
    }


    // =========================================================================
    // 일반적인 공통 유틸리티
    // =========================================================================

    // 공동으로 사용하는 화면보호(로딩) 함수
    function showOverlay(isShow) {
      const overlay = document.getElementById('screen-overlay');
      if (overlay) isShow ? overlay.classList.add('active') : overlay.classList.remove('active');
    }

    // 공동으로 사용하는 모달 함수
    function showModal(message, options) {
        options = options || {};
        const modal = document.getElementById('customErrorModal');
        const msgElement = document.getElementById('errorMessage');
        const confirmBtn = document.getElementById('modalConfirmBtn');
        const cancelBtn = document.getElementById('modalCancelBtn');

        if (!modal || !msgElement) return;

        msgElement.innerHTML = message;
        modal.style.display = 'block';

        confirmBtn.onclick = function() {
            closeErrorModal();
            if (options.onConfirm) options.onConfirm();
        };
        cancelBtn.style.display = options.showCancel ? 'inline-block' : 'none';
        cancelBtn.onclick = closeErrorModal;
        confirmBtn.style.display = options.hideAllBtn ? 'none' : 'inline-block';
    }

    function closeErrorModal() {
        const modal = document.getElementById('customErrorModal');
        if (modal) modal.style.display = 'none';
    }

  </script>


  <script>
    function FN_error_create(msg, schoolName) {
      document.title = (schoolName || "OO학교") + ' 클라우드';
      document.body.innerHTML = `

    let APP_STATE = {};
    let CFG = {};

    const CLIENT_SESSION_LIMIT_MS = 6 * 60 * 60 * 1000;

    window.checkAndTouchClientSession = function() {
      if (!APP_STATE.isLoggedIn && !sessionStorage.getItem("SPA_SESSION")) return true;
      try {
        const raw = sessionStorage.getItem("SPA_SESSION");
        if (!raw) return true;
        const parsed = JSON.parse(raw);
        const now = Date.now();
        if (parsed.lastActiveAt && (now - parsed.lastActiveAt > CLIENT_SESSION_LIMIT_MS)) {
          window.forceClientLogout("⛔ 로그인 세션이 만료되었습니다.\n다시 로그인해 주세요.");
          return false;
        }
        parsed.lastActiveAt = now;
        sessionStorage.setItem("SPA_SESSION", JSON.stringify(parsed));
        return true;
      } catch (e) {
        return true;
      }
    };

    const SPA_CACHE = {
      getKey: function(type, key) {

        const safeKey = String(key).toUpperCase();
        if (safeKey.includes("GONGJI")) {
          return `SPA_GLOBAL_${type}_${safeKey}`;
        }

        const activeHash = APP_STATE.isLoggedIn ? APP_STATE.userHashId : APP_STATE.guestHashId;
        return `SPA_${activeHash}_${type}_${String(key).toUpperCase()}`;
      },
      get: function(type, key) {
        try {
          if (type === "DATA") {
            const hash = localStorage.getItem(this.getKey(type, key + "_HASH")) || "";
            const raw = localStorage.getItem(this.getKey(type, key + "_DATA"));
            return { hash: hash, data: raw ? JSON.parse(raw) : null };
          } else {
            const ver = localStorage.getItem(this.getKey(type, key + "_VER")) || "";
            const raw = localStorage.getItem(this.getKey(type, key + "_DATA"));
            return { version: ver, data: raw ? JSON.parse(raw) : null };
          }
        } catch (e) {
          return type === "DATA" ? { hash: "", data: null } : { version: "", data: null };
        }
      },
      set: function(type, key, verOrHash, data) {
        try {
          if (type === "DATA") {
            localStorage.setItem(this.getKey(type, key + "_HASH"), String(verOrHash || ""));
            localStorage.setItem(this.getKey(type, key + "_DATA"), JSON.stringify(data));
          } else {
            localStorage.setItem(this.getKey(type, key + "_VER"), String(verOrHash || ""));
            localStorage.setItem(this.getKey(type, key + "_DATA"), JSON.stringify(data));
          }
        } catch (e) {}
      },

      syncData: function(targetKey, onRenderCallback, forceRefresh) {
        const cached = this.get("DATA", targetKey);
        let mySyncOverlay = false;
        
        if (!forceRefresh && cached.data !== null) {
          onRenderCallback(cached.data, true); 
        } else {
          if (targetKey !== "GONGJI" && typeof showOverlay === "function") {
            showOverlay(true);
            mySyncOverlay = true;
          }
        }

        const clientHash = forceRefresh ? "" : cached.hash;

        const handleSyncResponse = res => {
          if (mySyncOverlay && typeof showOverlay === "function") showOverlay(false);
          
          if (!res || !res.result) {
            if (res && res.isExpired && typeof window.forceClientLogout === "function") {
              window.forceClientLogout(res.msg);
            }
            return;
          }
          
          if (res.status === "CHANGED" || res.is_updated === true) {
            const newHash = res.hash || res.db_hash || res.hash1 || "";
            this.set("DATA", targetKey, newHash, res.return_data);
            onRenderCallback(res.return_data, false); 
          }
        };

        const handleSyncFailure = err => {
          if (mySyncOverlay && typeof showOverlay === "function") showOverlay(false);
          console.error(targetKey + " 동기화 오류:", err);
        };

        window.SUPA_DIRECT.rpc("rpc_spadata_sync", {
          p_target_key: targetKey,
          p_client_hash1: clientHash,
          p_client_hash2: clientHash,
          p_sid: APP_STATE.sid || "",
          p_school_code: APP_STATE.schoolCode || "OOO"
        }).then(handleSyncResponse).catch(handleSyncFailure);
      },

      findMenuMeta: function(code) {
        const sKey = String(code || "").trim().toLowerCase();
        const allBookmarks = [].concat(
          this.get("DATA", "BOOKMARK_PORTAL").data || [], 
          this.get("DATA", "BOOKMARK_MAIN").data || [],
          this.get("DATA", "USERBOOKMARK").data || [],
          this.get("DATA", "MENUBAR").data || []
        );
        const found = allBookmarks.find(m => (m.menuCd || "").toLowerCase() === sKey);
        if (found) {
          return { menuCd: found.menuCd, menuName: found.displayMenuName || found.menuName || found.shortName };
        }
        return null;
      }
    };

    function navigateTo(targetCode, forceRefresh) {
      if (!targetCode) return;

      if (APP_STATE.isLoggedIn && typeof window.checkAndTouchClientSession === "function") {
        if (!window.checkAndTouchClientSession()) return;
      }

      APP_STATE.currentCode = targetCode;

      if (APP_STATE.isLoggedIn && typeof window.initMenuBarData === "function") {
        if (!forceRefresh) {
          window.initMenuBarData(APP_STATE.userHashId, APP_STATE.sid);
        }
      }

      const appContainer = document.getElementById("spa-app-container");
      const contentBox = document.getElementById("spa-module-content");
      
      const localMeta = SPA_CACHE.findMenuMeta(targetCode);
      const fileKey = localMeta && localMeta.menuCd ? localMeta.menuCd : targetCode; 
      if (localMeta && localMeta.linkUrlSub !== undefined) APP_STATE.currentSubUrl = localMeta.linkUrlSub;

      const cachedHtml = SPA_CACHE.get("HTML", fileKey);
      const clientHash = forceRefresh ? "" : cachedHtml.version;
      let isPreRendered = false;

      if (!forceRefresh && cachedHtml.data) {
        if (localMeta && localMeta.menuName) document.getElementById("pageTitleText").innerText = localMeta.menuName;
        if (typeof showOverlay === "function") showOverlay(false);
        injectModuleHtml(cachedHtml.data);
        isPreRendered = true;
      } else {
        if (appContainer) appContainer.style.opacity = "0.2";
        if (typeof showOverlay === "function") showOverlay(true);
      }


      const handleModuleResponse = function(res) {
        if (appContainer) appContainer.style.opacity = "1"; 
        
        if (!res || !res.result) {
          if (typeof showOverlay === 'function') showOverlay(false);
          if (isPreRendered && contentBox) contentBox.innerHTML = ""; 
          
          if (res && res.isExpired && typeof window.forceClientLogout === 'function') {
            window.forceClientLogout(res.msg || "⛔ 로그인 세션이 만료되었습니다.");
            return;
          }
          
          const errMsg = (res && res.msg && String(res.msg).trim() !== "") 
                         ? res.msg 
                         : "⛔ 존재하지 않거나 접근할 수 없는 메뉴입니다.";
                         
          const returnCode = (APP_STATE.isLoggedIn && APP_STATE.sid) ? APP_STATE.mainmenuCode : APP_STATE.portalCode;
          
          if (typeof showModal === 'function') {
            showModal(errMsg, { 
              showCancel: false,
              onConfirm: function() { navigateTo(returnCode); } 
            });
          } else { 
            alert(errMsg); 
            navigateTo(returnCode); 
          }
          return;
        }

        document.getElementById("pageTitleText").innerText = res.menuName;
        APP_STATE.currentSubUrl = res.linkUrlSub || "";

        if (res.status === "CHANGED") {
          SPA_CACHE.set("HTML", res.menuCd, res.version, res.html);
          if (fileKey && fileKey !== res.menuCd) SPA_CACHE.set("HTML", fileKey, res.version, res.html);
          if (typeof showOverlay === 'function') showOverlay(false);
          injectModuleHtml(res.html);
        }
      };

      const handleModuleFailure = function(err) {
        if (typeof showOverlay === "function") showOverlay(false);
        if (appContainer) appContainer.style.opacity = "1";
        
        const returnCode = (APP_STATE.isLoggedIn && APP_STATE.sid) ? APP_STATE.mainmenuCode : APP_STATE.portalCode;
        
        if (typeof showModal === "function") {
            showModal("⛔ 모듈 로드 실패: " + err, {
                showCancel: false,
                onConfirm: function() { navigateTo(returnCode); }
            });
        } else { 
            alert("⛔ 모듈 로드 실패: " + err);
            navigateTo(returnCode);
        }
      };

      window.SUPA_DIRECT.rpc("rpc_spamodule_load", {
        p_target_code: targetCode,
        p_sid: APP_STATE.sid || "",
        p_client_hash: clientHash || "",
        p_school_code: APP_STATE.schoolCode || "OOO"
      }).then(handleModuleResponse).catch(handleModuleFailure);
    }  
    


    function injectModuleHtml(htmlStr) {
      const container = document.getElementById("spa-module-content");
      if (!container) return;

      window.onSpaModuleMount = null;
      container.innerHTML = htmlStr;

      const scripts = container.querySelectorAll("script");
      const loadScript = function(index) {
        if (index >= scripts.length) {
          if (typeof window.onSpaModuleMount === "function") {
            window.onSpaModuleMount(APP_STATE.sid, APP_STATE.currentSubUrl);
          }
          return;
        }

        const oldScript = scripts[index];
        const newScript = document.createElement("script");
        
        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
        newScript.textContent = oldScript.textContent;

        if (newScript.hasAttribute('src')) {
          newScript.onload = () => loadScript(index + 1);
          newScript.onerror = () => loadScript(index + 1);
          document.body.appendChild(newScript);
        } else {
          document.body.appendChild(newScript);
          loadScript(index + 1);
        }
        document.body.removeChild(newScript); 
      };

      loadScript(0);
    }

    function gongTable(dataArray) {
      const thead = document.getElementById("gongHead");
      const tbody = document.getElementById("gongBody");
      if (!thead || !tbody) return;

      if (dataArray && !Array.isArray(dataArray) && dataArray.data) dataArray = dataArray.data;
      if (!dataArray || !Array.isArray(dataArray) || dataArray.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3">📢 등록된 공지사항이 없습니다.</td></tr>`;
        return;
      }

      let startIndex = (dataArray[0] && (String(dataArray[0][2]).includes("긴급여부") || String(dataArray[0][3]).includes("제목"))) ? 1 : 0;
      if (dataArray.length <= startIndex) {
        tbody.innerHTML = `<tr><td colspan="3">📢 등록된 공지사항이 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = "";
      for (let i = startIndex; i < dataArray.length; i++) {
        const row = dataArray[i];
        if (!row || row.length < 3) continue;

        const type = row[2] || "공지없음"; 
        const title = row[3] || "-";
        const dateF = row[5] ? String(row[5]).split("T")[0] : "";
        const dateT = row[6] ? String(row[6]).split("T")[0] : "";
        const dateRange = (dateF && dateT) ? `${dateF} ~ ${dateT}` : "-";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="td-gu ${type.includes('공지') ? 'type-urgent' : 'type-text'}">${type}</td>
          <td class="td-je">${title}</td>
          <td class="td-date">${dateRange}</td>
        `;
        tr.onclick = () => {
          tbody.querySelectorAll("tr").forEach(r => r.classList.remove("selected"));
          tr.classList.add("selected");
          openGongModal(row);
        };
        tbody.appendChild(tr);
      }
    }

        { label: "내    용", value: (typeof escapeHtml === 'function' ? escapeHtml(rowData[4]) : rowData[4]) || "-" },
        { label: "공지기간", value: dateRange }

        <div style="text-align: left; margin-bottom: 15px; border-bottom: 2px solid #0056b3; padding-bottom: 8px;">
          <strong style="font-size: 18px; color: #1a202c;">📢 공지사항 상세보기</strong>
        </div>
        <table style="width:100%; border-collapse: collapse; text-align: left; font-size: 14px;">
      `;
      details.forEach(item => {
        const valueStyle = (item.label === "구    분" && String(item.value).includes("공지")) ? "color: red; font-weight: bold;" : "";
        contentHtml += `
          <tr style="border-bottom: 1px solid #edf2f7;">
            <td style="text-align: center; padding: 12px 10px; background: #f7fafc; font-weight: bold; width: 25%; border-right: 1px solid #edf2f7; color: #2d3748; white-space: nowrap;">${item.label}</td>
            <td style="text-align: left; padding: 12px 10px; width: 80%; white-space: pre-wrap; word-break: break-all; color: #4a5568; ${valueStyle}">${item.value}</td>
          </tr>`;
      });
      contentHtml += `</table>`;
      messageArea.innerHTML = contentHtml;
      modal.style.display = "block"; 
      confirmBtn.onclick = () => { modal.style.display = "none"; };
    }

    let isForcingLogout = false;
    window.forceClientLogout = function(msg) {
      if (isForcingLogout) return; 
      isForcingLogout = true;

      if (typeof showOverlay === "function") showOverlay(false);

      let savedSession = {};
      try { savedSession = JSON.parse(sessionStorage.getItem("SPA_SESSION") || "{}"); } catch(e) {}
      const oldSid = APP_STATE.sid || savedSession.sid || "";
      const oldUserId = APP_STATE.userHashId || savedSession.userHashId || "";
      const oldUserName = APP_STATE.userName || savedSession.userName || "";

      if (oldSid) {
        window.SUPA_DIRECT.rpc("rpc_auth_logout", {
          p_sid: oldSid,
          p_fallback_id: oldUserId,
          p_fallback_name: oldUserName,
          p_school_code: APP_STATE.schoolCode || "OOO"
        }).catch(function() {});
      }

      APP_STATE.isLoggedIn = false;
      APP_STATE.sid = "";
      APP_STATE.userHashId = APP_STATE.guestHashId;
      APP_STATE.userName = "";
      APP_STATE.userLevel = "A";
      sessionStorage.removeItem("SPA_SESSION");

      const infoBar1 = document.getElementById("info-bar_1");
      const infoBar2 = document.getElementById("info-bar_2");
      if (infoBar2) infoBar2.style.display = "none";
      if (infoBar1) infoBar1.style.display = "flex";

      const menuBar = document.getElementById("dynamicMenuBar");
      if (menuBar) menuBar.innerHTML = "";

      const contentBox = document.getElementById("spa-module-content");
      if (contentBox) contentBox.innerHTML = "";

      const logoutAlertMsg = msg || "⛔ 로그인 세션이 만료되었습니다.\n다시 로그인해 주세요.";

      const moveToPortal = function() {
        isForcingLogout = false;
        navigateTo(APP_STATE.portalCode, true);
      };

      if (typeof showModal === 'function') {
        showModal(String(logoutAlertMsg).replace(/\n/g, "<br>"), {
          showCancel: false,
          hideAllBtn: false,
          onConfirm: moveToPortal
        });
      } else {
        alert(logoutAlertMsg);
        moveToPortal();
      }
    };

    // =========================================================================
    // [추가] 기존 github_index.txt의 서비스 워커 등록 및 PWA 바로가기 설치 로직 통합
    // =========================================================================

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('서비스 워커 등록 성공:', reg))
          .catch(err => console.log('서비스 워커 등록 실패:', err));
      });
    }

    function analyzeBrowser() {
      const ua = navigator.userAgent.toLowerCase();
      return {
        isMobile: /iphone|ipad|ipod|android/.test(ua),
        isIOS: /iphone|ipad|ipod/.test(ua),
        isAndroid: /android/.test(ua),
        isSamsung: /samsungbrowser/.test(ua),
        isFirefox: /firefox|fxios/.test(ua),
        isSafari: /safari/.test(ua) && !/chrome|crios|edg|samsungbrowser|naver|kakao/.test(ua),
        isInApp: /kakao|naver|fbav|line/.test(ua)
      };
    }

    let deferredPrompt = null;
    const installBanner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');
    const bannerText = document.getElementById('banner-text');
    const manualGuideModal = document.getElementById('manual-guide-modal');
    const guideMessage = document.getElementById('guideMessage');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); 
      deferredPrompt = e;  
      
      const browser = analyzeBrowser();

      if (browser.isMobile) {
        bannerText.innerHTML = '📱 <b>클라우드</b>를<br>핸드폰 홈 화면에 앱으로 설치하세요!';
        installBtn.innerText = '앱 설치하기';
      } else {
        bannerText.innerHTML = '💻 <b>클라우드</b>를<br>바탕화면에 바로가기로 설치하세요!';
        installBtn.innerText = '바로가기 설치';
      }
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        try {
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            installBanner.style.display = 'none';
          }
        } catch (error) {
          console.error("설치 중 오류 발생:", error);
        }
        deferredPrompt = null;
      } else {
        installBanner.style.display = 'none';
        showManualGuide();
      }
    });

    window.addEventListener('appinstalled', () => {
      installBanner.style.display = 'none';
      manualGuideModal.style.display = 'none';
      const browser = analyzeBrowser();
      if (browser.isMobile) {
        alert('홈 화면에 앱이 성공적으로 설치되었습니다!');
      } else {
        alert('바탕화면에 바로가기가 성공적으로 설치되었습니다!');
      }
    });

    function showManualGuide() {
      const browser = analyzeBrowser();
      manualGuideModal.style.display = 'flex'; 

      if (browser.isMobile) {
        if (browser.isInApp) {
          guideMessage.innerHTML = '⚠️ <b>현재 인앱 브라우저 환경입니다.</b><br><br>오른쪽 위 메뉴(⋮ 또는 ⋯)를 눌러 <b>"다른 브라우저로 열기"</b>를 선택하시면 홈 화면에 바로 설치 창이 나타납니다.';
        } else if (browser.isIOS) {
          if (browser.isSafari) {
            guideMessage.innerHTML = '🍏 <b>아이폰 사파리 앱 추가</b><br><br>1. 하단 중앙의 <b>[공유하기]</b> 버튼(네모 박스 화살표)을 누릅니다.<br>2. 메뉴를 아래로 내려 <b>[홈 화면에 추가]->[웹 앱으로 열기] 끄기 후 추가</b>를 눌러주세요.';
          } else {
            guideMessage.innerHTML = '🍏 <b>아이폰 크롬/엣지 앱 추가</b><br><br>1. 주소창 주변의 <b>[공유하기]</b> 버튼을 누릅니다.<br>2. <b>[홈 화면에 추가]->[웹 앱으로 열기] 끄기 후 추가</b>를 선택해 주세요.';
          }
        } else if (browser.isSamsung) {
          guideMessage.innerHTML = '📱 <b>삼성 인터넷 앱 추가</b><br><br>화면 우측 하단 메뉴(三) ➡️ <b>[현재 페이지 추가]</b> ➡️ <b>[홈 화면]</b>을 선택해 주세요.';
        } else if (browser.isFirefox) {
          guideMessage.innerHTML = '🦊 <b>파이어폭스 앱 추가</b><br><br>우측 하단 메뉴(⋮)를 누른 뒤 <b>[홈 화면에 추가]</b>를 눌러주세요.';
        } else {
          guideMessage.innerHTML = '📱 <b>핸드폰 홈 화면에 앱 추가</b><br><br>브라우저 메뉴에서 <b>[홈 화면에 추가]</b> 또는 <b>[바로가기 만들기]</b>를 선택해 주세요.';
        }
      } 
      else {
        if (browser.isFirefox) {
          guideMessage.innerHTML = '🌐 <b>PC 파이어폭스 안내</b><br><br>파이어폭스는 바탕화면 바로가기 자동 설치를 지원하지 않습니다.<br><b>구글 크롬(Chrome)</b> 또는 <b>MS 엣지(Edge)</b>로 접속하시면 원클릭 설치가 가능합니다.';
        } else {
          guideMessage.innerHTML = '🌐 <b>바탕화면에 바로가기를 만드려면(자동설치불가시)?</b><br><br>' +
            '1. 현재 브라우저 주소창 맨 오른쪽 끝을 확인해 주세요.<br>' +
            '2. 모니터 모양 또는 더하기(+)가 붙은 <b>[앱 설치 아이콘]</b>을 누르시면 됩니다.<br><br>' +
            '아이콘이 없다면(크롬) <b>우측 상단 메뉴(⋮) ➡️ [저장 및 공유] ➡️ [앱 설치]</b>를 눌러주세요.<br><br>' +
            '아이콘이 없다면(엣지) <b>우측 상단 메뉴(...) ➡️ [기타도구] ➡️ [앱] ➡️ [앱설치]</b>를 눌러주세요.';
        }
      }
    }

    function requestInstallModal() {
      if (deferredPrompt) {
        installBanner.style.display = 'flex'; 
      } else {
        showManualGuide(); 
      }
    } 
  </script>

</body>
</html>
